<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oblation - VSSUT Satsang</title>

<style>

body{
    background-color:#1a1a1a;
    color:#fcebd5;
    font-family:'Georgia', serif;
    margin:0;
    padding:20px;
    text-align:center;
}

h1{
    color:orange;
    margin-bottom:40px;
    font-size:40px;
}

h2{
    color:yellowgreen;
    margin-bottom:20px;
    font-size:28px;
}

.offering-section{
    max-width:700px;
    margin:auto;
    text-align:center;
}

.qr-box{
    display:inline-block;
    border:2px solid white;
    border-radius:20px;
    padding:2px;
    background-color:#111;
}

.qr-container{
    display:flex;
    justify-content:center;
    align-items:center;
}

.qr-img{
    width:300px;
    max-width:100%;
    height:auto;
    display:block;
}

.note{
    font-size:24px;
    color:yellow;
    text-align:center;
    margin-top:20px;
    line-height:1.6;
}

/* Mobile Design */
@media screen and (max-width:768px){

    body{
        padding:10px;
    }

    h1{
        font-size:32px;
        margin-bottom:25px;
    }

    h2{
        font-size:24px;
    }

    .offering-section{
        width:100%;
    }

    .qr-box{
        width:90%;
        padding:1px;
        box-sizing:border-box;
    }

    .qr-img{
        width:100%;
        max-width:350px;
        margin:auto;
    }

    .note{
        font-size:18px;
        line-height:1.6;
        padding:0 10px;
    }
}

</style>
</head>

<body>

<h1>Oblation</h1>

<div class="offering-section">

    <h2>Offerings</h2>

    <div class="qr-box">

        <div class="qr-container">

            <img
                class="qr-img"
                src="qr code of vssut satsang for the financial year 2025-2026 updated.png"
                alt="QR Code for Satsang Offerings">

        </div>

    </div>

    <p class="note">
        Scan the QR to contribute to<br>
        VSSUT Satsang
    </p>

</div>

</body>
</html>
