<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Oblation - VSSUT Satsang</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #1a1a1a;
      color: #fcebd5;
      font-family: 'Georgia', serif;

    }
    h1 {
      text-align: center;
      color: orange;
      margin-bottom: 30px;
    }

      background-color: #1a1a1a;
      padding: -5px;

    h2 {

    }
    .qr-img {
  max-width: 150px;

}

    
    .note {
      font-size: 28px;
      color: yellow;
    text-align: center;

    }

</head>

    <img src="qr code of vssut satsang for the financial year 2025-2026 updated.png" alt=" qr code for satsang offerings"
