<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body {
      background:#0f0f0f;
      color:white;
      font-family: Arial, sans-serif;
      padding:30px;
    }
    .box {
      max-width:600px;
      margin:auto;
      background:#161616;
      padding:25px;
      border-radius:12px;
      box-shadow:0 0 20px rgba(214,162,94,0.3);
    }
    input, textarea, button {
      width:100%;
      padding:10px;
      margin-top:12px;
      border-radius:6px;
      border:none;
    }
    button {
      background:#d6a25e;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Upload Bhajan</h2>

  <input id="title" placeholder="Bhajan Title">
  
  <textarea id="lyrics" rows="8" placeholder="Bhajan Lyrics"></textarea>
  <input id="language" placeholder="Language (Hindi / Odia)">


  <button onclick="uploadBhajan()">Upload Bhajan</button>
  <button onclick="logout()">Logout</button>
  
  

  


  <p id="msg"></p>
</div>

<script>
  
async function uploadBhajan() {

  const title = document.getElementById("title").value.trim();
  const language = document.getElementById("language").value.trim();
  const lyrics = document.getElementById("lyrics").value.trim();
  const msg = document.getElementById("msg");

  if (!title || !language || !lyrics) {
    msg.innerText = "⚠️ Please fill all fields";
    msg.style.color = "orange";
    return;
  }

  try {
    const response = await fetch("http://localhost:8080/admin/addBhajan", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",   // 🔥 session must go
      body: JSON.stringify({ title, language, lyrics })
    });

    const result = await response.text();

    msg.innerText = result;
    msg.style.color = result.includes("SUCCESS") ? "lightgreen" : "red";

    if (result.includes("SUCCESS")) {
      document.getElementById("title").value = "";
      document.getElementById("language").value = "";
      document.getElementById("lyrics").value = "";
    }

  } catch (e) {
    msg.innerText = "Server error ❌";
    msg.style.color = "red";
  }
}


async function deleteBhajan(id) {

  if (!confirm("Are you sure you want to delete this bhajan?")) return;

  const response = await fetch(
    `http://localhost:8080/admin/deleteBhajan/${id}`,
    {
      method: "DELETE",
      credentials: "include"
    }
  );

  const result = await response.text();
  alert(result);

  // reload list after delete
  loadBhajans();
}

async function editBhajan(id) {
  await fetch(`http://localhost:8080/admin/editBhajan/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({
      title: "New Title",
      lyrics: "Updated lyrics",
      language: "Odia"
    })
  });
}


</script>


</body>
</html>
