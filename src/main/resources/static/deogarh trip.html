<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deogarh Trip - VSSUT Satsang</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #0d0d0d;
      color: #fcebd5;
      font-family: 'Georgia', serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 30px;
    }

    .year-section {
      max-width: 900px;
      margin: auto;
    }

    details {
      background-color: #1a1a1a;
      border-radius: 10px;
      margin-bottom: 20px;
      padding: 20px;
      border: 1px solid white;
    }

    summary {
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .gallery iframe {
      width: 100%;
      max-width: 400px;
      height: 250px;
      border: none;
      border-radius: 10px;
    }

    .gallery p {
      text-align: center;
      margin-top: 10px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Deogarh Trip</h1>

  <div class="year-section">
    <details open>
      <summary>2024</summary>
      <div class="gallery">
        <!-- Embed Google Drive album or individual photos -->
        <!-- Replace the iframe src below with your shared drive photo embed link -->
        <iframe src="https://drive.google.com/file/d/your-photo-id/preview" allow="autoplay"></iframe>
        <iframe src="https://drive.google.com/file/d/your-photo-id/preview" allow="autoplay"></iframe>
        <iframe src="https://drive.google.com/file/d/your-photo-id/preview" allow="autoplay"></iframe>
        <p>More photos available in the full album.</p>
      </div>
    </details>
  </div>
</body>
</html>
