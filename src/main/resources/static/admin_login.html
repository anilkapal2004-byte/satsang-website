<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="Admin login portal for managing VSSUT Satsang gallery photos and devotional content.">

  <title>

    Admin Login | VSSUT Satsang

  </title>

  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Shared CSS -->

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <h1>

        Admin Login

      </h1>

      <p>

        Sign in to manage gallery photos,
        bhajans, and website content.

      </p>

      <input type="text" id="username" placeholder="Username" aria-label="Username" autocomplete="username">


      <input type="password" id="password" placeholder="Password" aria-label="Password" autocomplete="current-password">


      <button class="btn-primary" onclick="adminLogin()">

        Login

      </button>

      <div id="msg"></div>

    </section>

  </main>
  <script>

    async function adminLogin() {

      const username =
        document
          .getElementById("username")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value
          .trim();

      const msg =
        document.getElementById("msg");


      if (!username || !password) {

        msg.innerText = "Fill all fields";

        return;

      }


      try {

        const response =
          await fetch(
            `http://localhost:8080/admin/login`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
              credentials: "include"
            }
          );


        const result =
          await response.text();


        if (result === "LOGIN_SUCCESS") {

          window.location.href =
            "admin_dashboard.html";

        }

        else {

          msg.innerText = result;

        }

      }

      catch (error) {

        msg.innerText =
          "Unable to connect to the server.";

      }

    }

  </script>

</body>

</html>
